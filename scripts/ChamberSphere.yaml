variables:
  - Pin
  - Qin
  - Pout
  - Qout
  - stress
  - tau
  - volume

derivatives:
  - dPin_dt
  - dQin_dt
  - dPout_dt
  - dQout_dt
  - dstress_dt
  - dtau_dt
  - dvolume_dt

constants:
  - gamma
  - n
  - volume0
  - a
  - b
  - a4f
  - b4f
  - a4s
  - b4s
  - eta
  - act
  - act_plus
  - sigma_max

time_dependent:
  - act
  - act_plus

helper_functions: |
  def V(volume):
      return volume + volume0

  def stretch(volume):
      V_val = V(volume)
      return (V_val / volume0) ** (1 / (3 * n))

  def CG(volume):
      stretch_val = stretch(volume)
      return (stretch_val) ** 2
  
  def dstretch_dt(volume, dvolume_dt):
      V_val = V(volume)
      return (1 / (3 * n)) * (V_val / volume0) ** ((1 / (3 * n)) - 1) * (1 / volume0) * dvolume_dt

  def dCG(volume, dvolume_dt):
      stretch_val = stretch(volume)
      dstretch = dstretch_dt(volume, dvolume_dt)
      return 2 * stretch_val * dstretch
  
  def macaulay(x):
      return Max(x, 0.0)

  def J1(volume):
      C = CG(volume)
      return (1.0 / (C**2)) + 2.0 * C

  def dWe_dJ1(volume):
      return 0.5 * a * exp(b * (J1(volume) - 3.0))

  def dWe_dJ4(volume):
      C = CG(volume)
      m = macaulay(C - 1.0)
      return (a4f * m * exp(b4f * m**2)+ a4s * m * exp(b4s * m**2))

residuals:
  - gamma * stretch(volume) * stress - Pout * CG(volume)
  - -stress + tau + 4.0 * (1.0 - CG(volume) ** (-3)) * dWe_dJ1(volume) + 2.0 * dWe_dJ4(volume) + eta * dCG(volume, dvolume_dt) * (1.0 + 2.0 * CG(volume) ** (-6))
  - dtau_dt + act * tau - sigma_max * act_plus
  - Qin - Qout - dvolume_dt
  - Pin - Pout