variables:
  - Pin
  - Qin
  - Pout
  - Qout
  - stress
  - tau
  - volume

derivatives:
  - dPin_dt
  - dQin_dt
  - dPout_dt
  - dQout_dt
  - dstress_dt
  - dtau_dt
  - dvolume_dt

# Order must match the ParamId enum in ChamberSphere.h so that
# global_param_ids[ParamId::<name>] lines up with the calibration parameters.
# gamma has been absorbed into the (rescaled) stress/tau states by multiplying
# residuals 2 and 3 through by gamma. It therefore only survives as the products
# below, which are exactly the quantities provided in the solver input file.
#   stress  here represents  gamma * stress
#   tau     here represents  gamma * tau
#   guccione_C represents    gamma * C  (the Guccione passive scaling)
constants:
  - volume0
  - guccione_C # gamma * C, scaling in front of the Guccione exponential
  - gamma_sigma_max # gamma * sigma_max, active-stress amplitude
  - t_shift # two-hill twitch onset
  - tau_1 # two-hill rise time
  - tau_2 # two-hill fall time
  - m1 # two-hill rise exponent
  - m2 # two-hill fall exponent
  - b_f # Guccione fiber exponent (dimensionless)
  - b_t # Guccione transverse exponent (dimensionless)

# In-cycle time of the activation. Not a state variable and not a calibration
# parameter (no Jacobian column), but the activation depends on it. The solver
# code computes the activation in ChamberSphere::get_elastance_values; here it is
# written symbolically so that scripts/jacobian.py can differentiate the
# active-stress equation with respect to the activation/timing parameters for the
# calibrator's update_gradient. The two must stay consistent.
time_symbol: t

helper_functions: |
  from sympy import exp

  def V(volume):
      return volume + volume0

  def stretch(volume):
      V_val = V(volume)
      return (V_val / volume0) ** (1 / 3)

  def CG(volume):
      stretch_val = stretch(volume)
      return (stretch_val) ** 2

  # Guccione passive spherical wall stress for a thin-walled incompressible
  # sphere. The in-plane stretch is lam = stretch, the radial stretch lam^-2, so
  # the Green-Lagrange strains are E_p = (lam^2 - 1)/2 (in-plane fiber/sheet) and
  # E_r = (lam^-4 - 1)/2 (radial). With no shear, Q = (b_f + b_t) E_p^2 + b_t E_r^2
  # and the mean in-plane Cauchy stress (sigma_radial = 0 for the thin wall) is
  #   S = C exp(Q) [ (b_f + b_t)/2 lam^2 E_p - b_t lam^-4 E_r ].
  # b_fs drops out: it only multiplies shear terms, which vanish here.
  def E_p(volume):
      return 0.5 * (CG(volume) - 1)

  def E_r(volume):
      return 0.5 * (CG(volume) ** (-2) - 1)

  def Q_guc(volume):
      return (b_f + b_t) * E_p(volume) ** 2 + b_t * E_r(volume) ** 2

  def passive(volume):
      cg = CG(volume)
      return guccione_C * exp(Q_guc(volume)) * (
          0.5 * (b_f + b_t) * cg * E_p(volume) - b_t * cg ** (-2) * E_r(volume))

  # Smooth two-hill activation twitch in [0, ~1): a rising hill g1/(1+g1) times a
  # falling hill 1/(1+g2). Produces a single peaked hump (so the active stress and
  # P-V loop are rounded, not rectangular). t is the in-cycle time; gamma_sigma_max
  # absorbs the (un)normalization. Identical to ChamberSphere::get_elastance_values.
  ts = t - t_shift
  g1 = (ts / tau_1) ** m1
  g2 = (ts / tau_2) ** m2
  activation = g1 / (1 + g1) / (1 + g2)

residuals:
  - stretch(volume) * stress - Pout * CG(volume)
  - -stress + tau + passive(volume)
  - tau - gamma_sigma_max * activation
  - Qin - Qout - dvolume_dt
  - Pin - Pout
