variables:
  - Pin
  - Qin
  - Pout
  - Qout
  - stress
  - tau
  - volume

derivatives:
  - dPin_dt
  - dQin_dt
  - dPout_dt
  - dQout_dt
  - dstress_dt
  - dtau_dt
  - dvolume_dt

# gamma has been absorbed into the (rescaled) stress/tau states by multiplying
# residuals 2 and 3 through by gamma. It therefore only survives as the products
# below, which are exactly the quantities provided in the solver input file.
#   stress  here represents  gamma * stress
#   tau     here represents  gamma * tau
constants:
  - volume0
  - gamma_W1
  - gamma_sigma_max # gamma * sigma_max
  - act
  - act_plus
  - prestress

time_dependent:
  - act
  - act_plus

helper_functions: |
  def V(volume):
      return volume + volume0

  def stretch(volume):
      V_val = V(volume)
      return (V_val / volume0) ** (1 / 3)

  def CG(volume):
      stretch_val = stretch(volume)
      return (stretch_val) ** 2

residuals:
  - stretch(volume) * stress - Pout * CG(volume)
  - -stress + tau + 4 * gamma_W1 * (1 - CG(volume) ** (-3)) + prestress
  - dtau_dt + act * tau - gamma_sigma_max * act_plus
  - Qin - Qout - dvolume_dt
  - Pin - Pout